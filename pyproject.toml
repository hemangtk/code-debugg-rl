[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adversarial-reasoning-gym"
version = "0.1.0"
description = "OpenEnv RL environment for code debugging that resists user misconceptions"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Adversarial Reasoning Gym contributors" }]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "httpx>=0.27.0",
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
train = [
    "trl>=0.29.0",
    "transformers>=4.45.0",
    "datasets>=2.20.0",
    "accelerate>=0.30.0",
    "torch>=2.2.0",
]

[tool.setuptools.packages.find]
include = ["server*"]
exclude = ["tests*", "_*"]
